[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molsim"
version = "1.1.0"
description = "Molecular simulation exercises (pure-Python subset, no C++ extension build)"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib", "scipy", "numba"]

[tool.setuptools.packages.find]
where = ["."]
include = ["molsim*"]
